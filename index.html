<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pallet Ross</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <span class="brand-logo" aria-hidden="true"></span>
            <span class="brand-name">Pallet Ross</span>
        </div>
        <nav class="main-nav" aria-label="Primary">
            <a href="#get-started">Get Started</a>
            <a href="#create-strategy" class="nav-with-icon">
                <span class="nav-icon" aria-hidden="true"></span>
                Create strategy
            </a>
            <a href="#pricing">Pricing</a>
            <a href="#contact">Contact</a>
            <a href="#solution">Solution</a>
            <a href="#ecommerce">E-Commerce</a>
        </nav>
        <div class="header-actions">
            <button class="icon-button" id="accountButton" aria-label="Account">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                </svg>
            </button>
            <button class="icon-button" id="themeToggle" aria-label="Toggle theme">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1 class="hero-title">A place to display<br> your masterpiece.</h1>

            <div class="card-stack" role="list" aria-label="Featured artwork">
                <div class="art-card card-1" role="listitem">
                    <span class="art-tag">TESLA</span>
                </div>
                <div class="art-card card-2" role="listitem"></div>
                <div class="art-card card-3" role="listitem">
                    <span class="art-tag">Social club</span>
                </div>
                <div class="art-card card-4" role="listitem"></div>
                <div class="art-card card-5" role="listitem"></div>
                <div class="art-card card-6" role="listitem">
                    <span class="art-tag">31 AUG · Independence Day</span>
                    <span class="art-number">66</span>
                </div>
                <div class="art-card card-7" role="listitem"></div>
            </div>

            <p class="hero-subtext">
                Artists can display their masterpieces, and buyers can <span class="fade-in">discover and</span> collect them.
            </p>

            <div class="cta-row">
                <button class="cta-button" id="joinButton">Join for $9.99/m</button>
                <a href="#learn-more" class="read-more">Read more</a>
            </div>
            <div id="message" aria-live="polite"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
